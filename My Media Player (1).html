<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>My Media Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* One dark liquid-glass look: a single wallpaper, one glass material for every surface, one accent that the Theme option swaps. */
:root{
  color-scheme: dark;
  --ac:255,138,0; --ac2:255,178,90; --ac3:255,154,77; --wl:255,90,60; --wb:110,70,230;
  --b0:#0b0c1c; --b1:#15112f; --b2:#0e0b24; --ga:.34; --gbt:.40;
  --night:var(--b0);
  --ink:#F4F4F6;
  --ink-2:rgba(255,255,255,.62);
  --amber:rgb(var(--ac));
  --amber-hi:rgb(var(--ac2));
  --amber-text:rgb(var(--ac3));
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.045)),rgba(20,16,44,.40);
  --glass-edge:rgba(255,255,255,.20);
  --glass-lit:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.05);
  --glass-drop:0 16px 32px -14px rgba(0,0,0,.75);
  --glass-blur:blur(22px) saturate(150%);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --top:calc(env(safe-area-inset-top,0px) + 18px);
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --gb:calc(env(safe-area-inset-bottom,0px) + 12px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,input:focus-visible,.sl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

#app{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,480px);margin-left:calc(min(100vw,480px) / -2);overflow:hidden;isolation:isolate}
#wall{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(ellipse 120% 42% at 92% 0%,rgba(var(--ac),var(--ga)),rgba(var(--ac),0) 62%),
  radial-gradient(ellipse 90% 30% at 0% 26%,rgba(var(--wl),.12),rgba(var(--wl),0) 70%),
  radial-gradient(ellipse 110% 45% at 50% 100%,rgba(var(--wb),var(--gbt)),rgba(var(--wb),0) 70%),
  linear-gradient(180deg,var(--b0),var(--b1) 55%,var(--b2))}

/* the one glass material */
.glass{background:var(--glass-fill);border:1px solid var(--glass-edge);box-shadow:var(--glass-lit),var(--glass-drop);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.glow{color:var(--amber);position:relative;overflow:hidden;background:
  radial-gradient(ellipse 75% 55% at 50% 108%,rgba(var(--ac),.7),rgba(var(--ac),.22) 55%,rgba(var(--ac),0)),
  linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px -10px rgba(var(--ac),.6)}
.pill button.glow,.nb.glow{color:var(--amber)}
.glow::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(var(--ac),0),rgb(var(--ac2)) 30%,rgb(var(--ac2)) 70%,rgba(var(--ac),0));box-shadow:0 0 8px rgba(var(--ac),.9)}

/* top bar */
#top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:var(--top) var(--gr) 0 var(--gl)}
.pill{height:56px;border-radius:28px;display:flex;align-items:center;padding:4px}
.pill.round{width:56px;flex:none;justify-content:center}
.pill button{height:46px;border-radius:23px;display:grid;place-items:center;color:var(--ink)}
.pill.round button{width:46px}
.pill svg{width:26px;height:26px}
.grow{flex:1}
.seg{flex:0 1 178px;min-width:0}
.seg button{flex:1;min-width:0;font-size:17px;font-weight:500;letter-spacing:-.2px}
.seg button.on{font-weight:600}
.duo{flex:none}.duo button{width:46px}
.searchbox{flex:1;min-width:0;padding:0 18px;gap:10px;color:var(--ink)}
.searchbox svg{width:22px;height:22px;flex:none}
.searchbox input{flex:1;min-width:0;height:44px;background:none;border:0;color:var(--ink);font:inherit;font-size:17px;outline:0}
.searchbox input::placeholder{color:var(--ink-2)}
.searchbox:focus-within{border-color:rgba(var(--ac),.6)}

/* lists */
#scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 100px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 112px) var(--gl);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,transparent calc(env(safe-area-inset-top,0px) + 74px),#000 calc(env(safe-area-inset-top,0px) + 98px),#000 calc(100% - 100px),transparent calc(100% - 28px));
  mask-image:linear-gradient(180deg,transparent 0,transparent calc(env(safe-area-inset-top,0px) + 74px),#000 calc(env(safe-area-inset-top,0px) + 98px),#000 calc(100% - 100px),transparent calc(100% - 28px))}
#scroller::-webkit-scrollbar{display:none}
.lbl{margin:0 0 8px 10px;font-size:13px;font-weight:600;letter-spacing:1.4px;line-height:18px;color:var(--amber-text)}
.lbl:not(:first-child){margin-top:22px}
.recent{border-radius:30px;padding:5px}
.row{display:flex;align-items:center;height:64px;border-radius:32px;padding:0 4px 0 10px;border:1px solid transparent}
.recent .row{padding-left:6px}
.main{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:12px;text-align:left}
.tile{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid var(--glass-edge);box-shadow:var(--glass-lit)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile svg{width:24px;height:24px}
.meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.t{font-size:15px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12.5px;line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.more{flex:none;width:40px;height:44px;display:grid;place-items:center;color:rgba(255,255,255,.72)}
.more svg{width:22px;height:22px}
.row.now{border-color:rgba(var(--ac),.6);background:linear-gradient(90deg,rgba(var(--ac),.20),rgba(var(--ac),.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 26px -8px rgba(var(--ac),.55)}
.row.now .t{color:rgb(var(--ac2));font-weight:600}
.row.now .s{color:rgba(var(--ac2),.85)}
.row.now .tile{border-color:rgba(var(--ac),.6);background:linear-gradient(160deg,rgba(var(--ac),.32),rgba(var(--ac),.08))}
.eqi,.nowtag{display:none}
.now .eqi{display:block}.now .ti,.now .tile img{display:none}.now .nowtag{display:inline}
.eb{transform-box:fill-box;transform-origin:50% 100%}
.eb:nth-child(1){fill:rgb(var(--ac2))}.eb:nth-child(2){fill:rgb(var(--ac))}.eb:nth-child(3){fill:rgb(var(--wl))}
#app.playing .eb{animation:eq 1s ease-in-out infinite}
#app.playing .eb:nth-child(2){animation-delay:-.4s}
#app.playing .eb:nth-child(3){animation-delay:-.75s}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.empty{margin:26vh 24px 0;text-align:center;color:var(--ink-2);font-size:15px;line-height:1.55}

/* video rows */
.vrow{display:flex;align-items:center;height:59px;padding-left:2px}
.vrow .main{gap:14px}
.vthumb{position:relative;flex:none;width:81px;height:51px;border-radius:9px;overflow:hidden;background:#07060f;border:1px solid var(--glass-edge);box-shadow:var(--glass-lit)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mos{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;width:100%;height:100%;background:rgba(255,255,255,.12)}
.mos span{background:#07060f;overflow:hidden}.mos img{width:100%;height:100%;object-fit:cover}
.vbar{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);border-radius:0 2px 2px 0}
.vrow .t{font-size:16px;font-weight:400}
.vrow .s{font-size:13px;color:rgba(255,255,255,.78)}
#fab{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 132px);z-index:6;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#120d24;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.1)),rgb(var(--ac));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.12),0 14px 28px -10px rgba(var(--ac),.7)}
#fab svg{width:26px;height:26px;margin-left:2px}

/* bottom: tab bar + avatar, or the mini player */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:12px;padding:0 var(--gr) var(--gb) var(--gl)}
.navpill{flex:1;min-width:0;height:60px;border-radius:30px;padding:4px;display:flex}
.nb{flex:1;min-width:0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;position:relative;overflow:hidden;color:var(--ink)}
.nb svg{width:24px;height:24px}
.nb.on{font-weight:600}
.avatar{flex:none;width:62px;height:62px;border-radius:50%;padding:3px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;animation:spin 9s linear infinite;animation-play-state:paused}
#app.playing .avatar img{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#mini{flex:1;min-width:0;height:76px;border-radius:38px;padding:8px 16px 8px 12px;display:flex;flex-direction:column;justify-content:space-between;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.mrow{display:flex;align-items:center;gap:10px;height:42px}
.mart{flex:none;width:40px;height:40px;border-radius:13px;overflow:hidden;border:1px solid var(--glass-edge)}
.mart img{width:100%;height:100%;object-fit:cover;display:block}
.mtext{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.mtext b{font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtext span{font-size:12px;line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.vdiv{flex:none;width:1px;height:30px;background:rgba(255,255,255,.16)}
.mctl{display:flex;align-items:center;flex:none}
.mctl button,.mvol{width:34px;height:42px;display:grid;place-items:center}
.mctl .mp{width:42px}
.mctl svg{width:22px;height:22px}.mctl .mp svg{width:26px;height:26px}.mvol svg{width:22px;height:22px}
.mseek{display:flex;align-items:center;gap:10px;height:16px;font-size:11.5px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}

/* sliders */
.sl{--p:0%;--track:rgba(255,255,255,.22);position:relative;height:16px;flex:1;touch-action:none;cursor:pointer}
.sl::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:var(--track)}
.sl i{position:absolute;left:0;top:50%;height:3px;width:var(--p);margin-top:-1.5px;border-radius:3px;background:linear-gradient(90deg,var(--amber),var(--amber-hi))}
.sl b{position:absolute;top:50%;left:var(--p);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(var(--ac),.7),0 1px 3px rgba(0,0,0,.5)}

/* now playing */
#np{position:absolute;inset:0;z-index:20;visibility:hidden;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s;background:var(--night);overflow:hidden}
#np.open{visibility:visible;transform:none;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#npbg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.25) brightness(.55)}
#np .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,8,20,.5),rgba(9,8,20,.28) 40%,rgba(9,8,20,.78))}
.npscroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:var(--top) var(--gr) calc(env(safe-area-inset-bottom,0px) + 28px) var(--gl)}
.npscroll::-webkit-scrollbar{display:none}
.nptop{display:flex;justify-content:space-between}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.rbtn svg{width:22px;height:22px}
.npcard{margin-top:20px;border-radius:30px;padding:18px 17px 26px}
.npart{width:100%;aspect-ratio:322/268;border-radius:20px;overflow:hidden;border:1px solid var(--glass-edge);background:#0c0a1a}
.npart img{width:100%;height:100%;object-fit:cover;display:block}
.npt{margin-top:22px;padding:0 2px;font-size:24px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npa{margin-top:2px;padding:0 2px;font-size:18px;line-height:1.3;min-height:23px;color:rgba(255,255,255,.86);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npsl{margin-top:22px;padding:0 2px;display:flex;--track:rgba(255,255,255,.92)}
.npsl .sl{height:24px}
.npsl .sl b{width:16px;height:16px;margin:-8px 0 0 -8px}
.npctl{margin-top:22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center}
.npctl .skip{width:64px;height:64px;display:grid;place-items:center}
.npctl .skip svg{width:34px;height:34px}
.bigplay{width:100px;height:100px;border-radius:50%;background:#fff;color:#1b1633;display:grid;place-items:center;box-shadow:inset 0 -6px 12px rgba(0,0,0,.08),0 14px 30px -10px rgba(0,0,0,.6)}
.bigplay svg{width:44px;height:44px}
.npsub{margin-top:4px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;justify-items:center}
.npsub button{width:48px;height:48px;display:grid;place-items:center}
.npsub svg{width:30px;height:30px}
.npsub .heart{margin-top:16px}.npsub .heart svg{width:30px;height:30px}
.lyr{margin-top:36px;border-radius:30px;padding:20px 20px 24px;min-height:300px;text-align:center}
.lyr h3{margin:0;font-size:24px;font-weight:700;line-height:1.3}

/* video player */
#vp{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden}
#vrot{position:absolute;inset:0}
#vp.rot #vrot{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.vui{position:absolute;inset:0;pointer-events:none;transition:opacity .25s;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.vui::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 58%,rgba(0,0,0,.6))}
.vin{position:relative;width:100%;height:100%;pointer-events:none}
.vin>*{pointer-events:auto}
#vp.idle .vui{opacity:0}#vp.idle .vin>*{pointer-events:none}
.vb{position:absolute;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.vb svg{width:26px;height:26px}
#vBack{left:28px;top:12px}
#vShot{right:96px;top:14px}
#vMore{right:28px;top:14px}
.vbot{position:absolute;left:40px;right:40px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.vtimes{width:100%;display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.vbot .sl{width:100%;flex:none;height:22px;--track:#fff}
.vplay{width:58px;height:58px;border-radius:50%;background:#fff;color:#1b1633;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.6)}
.vplay svg{width:26px;height:26px}

/* popover, sheets, toast */
#vgest{position:absolute;inset:0;touch-action:none}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#gind{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:12px;height:48px;padding:0 20px;border-radius:24px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
#gind svg{width:22px;height:22px}
.gbar{display:block;width:110px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--amber)}
.nptimes{display:flex;justify-content:space-between;padding:0 2px;font-size:13px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
.shead{display:flex;align-items:center;gap:6px;margin:0 0 6px -10px}
.shead .sh3{margin:0}
.sback{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.sback svg{width:22px;height:22px}
.hint{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
#scrim{position:fixed;inset:0;z-index:59}
#pop{position:fixed;z-index:60;min-width:200px;max-height:calc(100vh - 16px);overflow-y:auto;border-radius:22px;padding:6px;display:flex;flex-direction:column;animation:rise .18s ease-out}
#pop button{flex:none;height:44px;padding:0 16px;text-align:left;border-radius:16px;font-size:15px;font-weight:500}
#pop button:active{background:rgba(255,255,255,.1)}
#sheetWrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
#sheetScrim{position:absolute;inset:0;background:rgba(5,4,14,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#sheet{position:relative;width:min(100%,480px);max-height:82%;overflow-y:auto;border-radius:30px 30px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px));animation:sup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:2px auto 12px}
.sh3{margin:0 0 6px;font-size:20px;font-weight:700;line-height:1.3}
.slbl{margin:18px 0 4px;font-size:13px;font-weight:600;letter-spacing:1.2px;color:var(--amber-text)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;text-align:left;font-size:16px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.08)}
.srow:last-child{border-bottom:0}
.srow.opt svg{width:22px;height:22px;color:var(--amber);flex:none}
.srow.danger{color:#FF8E8E}
.sw{position:relative;flex:none;width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.16);border:1px solid var(--glass-edge);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--amber)}
.sw[aria-checked=true]::after{transform:translateX(22px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:500;border:1px solid var(--glass-edge);background:rgba(255,255,255,.07)}
.chip.on{color:var(--amber);border-color:rgba(var(--ac),.6);background:rgba(var(--ac),.16)}
.bands{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.band{display:grid;grid-template-columns:62px 1fr 58px;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.band .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent;--lo:50%;--hi:50%}
.rng::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.25) var(--lo),rgb(var(--ac)) var(--lo),rgb(var(--ac)) var(--hi),rgba(255,255,255,.25) var(--hi))}
.rng::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.25) var(--lo),rgb(var(--ac)) var(--lo),rgb(var(--ac)) var(--hi),rgba(255,255,255,.25) var(--hi))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8.5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 10px rgba(var(--ac),.7),0 1px 3px rgba(0,0,0,.5)}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 10px rgba(var(--ac),.7),0 1px 3px rgba(0,0,0,.5)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.skin{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--glass-edge);background:rgba(255,255,255,.05)}
.skin i{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px rgba(0,0,0,.7)}
.skin.on{border-color:rgba(var(--ac),.7);background:rgba(var(--ac),.12)}
#sheet .row{height:60px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);z-index:80;max-width:min(86%,380px);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:500;text-align:center;animation:rise .2s ease-out}
#shot{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:rgba(5,4,14,.86)}
#shot img{max-width:100%;max-height:72%;border-radius:12px;border:1px solid var(--glass-edge)}
#shot p{margin:0;color:var(--ink-2);font-size:14px}

@media (prefers-reduced-motion:reduce){#np,#np.open{transition:none}#app.playing .eb{animation:none}.vui{transition:none}.avatar img{animation:none!important}#mini,#pop,#sheet,#toast{animation:none}}
</style>

  <header id="top"></header>
  <button id="fab" data-act="fab" aria-label="Play video" hidden></button>

  <footer id="bottom">
    <nav id="navpill" class="navpill glass" aria-label="Library"></nav>
    <button id="avatar" class="avatar glass" data-act="avatar" aria-label="Show player"><img id="avImg" alt=""></button>
    <div id="mini" class="glass" hidden>
      <div class="mrow">
        <button class="mart" data-act="collapse" aria-label="Hide player"><img id="mArt" alt=""></button>

        <i class="vdiv"></i>
        <div class="mctl">
          <button data-act="mPrev" aria-label="Previous" id="mPrevB"></button>
          <button class="mp" id="mPlay" data-act="mPlay" aria-label="Play"></button>
          <button data-act="mNext" aria-label="Next" id="mNextB"></button>
        </div>
        <i class="vdiv"></i>
        <button class="mvol" id="mVol" data-act="mVol" aria-label="Mute"></button>

    </div>
  </footer>

  <section id="np" aria-label="Now playing" aria-hidden="true" inert>
    <div id="npbg"></div><div class="shade"></div>
    <div class="npscroll">
      <div class="nptop">
        <button class="rbtn glass" data-act="npclose" aria-label="Close"></button>
        <button class="rbtn glass" data-act="npmenu" aria-label="More options"></button>
      </div>
      <div class="npcard glass">
        <div class="npart"><img id="npImg" alt=""></div>
        <div class="npt" id="npT"></div>
        <div class="npa" id="npA"></div>
        <div class="npsl"><div class="sl" id="npSl" role="slider" aria-label="Seek" tabindex="0"><i></i><b></b></div></div>
        <div class="nptimes"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>
        <div class="npctl">
          <button class="skip" data-act="npPrev" aria-label="Previous"></button>
          <button class="bigplay" id="npPlay" data-act="npPlay" aria-label="Play"></button>
          <button class="skip" data-act="npNext" aria-label="Next"></button>
        </div>
        <div class="npsub">
          <button data-act="npRew" aria-label="Back 10 seconds"></button>
          <button class="heart" id="npHeart" data-act="npFav" aria-label="Favorite"></button>
          <button data-act="npFwd" aria-label="Forward 10 seconds"></button>
        </div>
      </div>
      <div class="lyr glass"><h3>Lyrics</h3></div>
    </div>
  </section>

  <section id="vp" aria-label="Video player" hidden>
    <div id="vrot">
      <video id="vid" playsinline></video>
      <div id="dim"></div><div id="flash"></div><div id="vgest"></div><div id="gind" class="glass" hidden></div>
      <div class="vui"><div class="vin">
        <button class="vb glass" id="vBack" data-act="vclose" aria-label="Back"></button>
        <button class="vb glass" id="vShot" data-act="vshot" aria-label="Screenshot"></button>
        <button class="vb glass" id="vMore" data-act="vmore" aria-label="More options"></button>
        <div class="vbot">
          <div class="vtimes"><span id="vCur">0:00</span><span id="vDur">0:00</span></div>
          <div class="sl" id="vSl" role="slider" aria-label="Seek" tabindex="0"><i></i><b></b></div>
          <button class="vplay" id="vPlay" data-act="vplay" aria-label="Play"></button>
        </div>
      </div></div>
    </div>
  </section>

  <div id="scrim" data-act="scrim" hidden></div>
  <div id="pop" class="glass" hidden></div>
  <div id="sheetWrap" hidden>
    <div id="sheetScrim" data-act="sheetclose"></div>
    <div id="sheet" class="glass" role="dialog" aria-modal="true" aria-labelledby="sheetT">
      <div class="grab"></div><div class="shead"><button class="sback" id="sBack" data-act="sheetback" aria-label="Back" hidden></button><h3 class="sh3" id="sheetT"></h3></div><div id="sheetB"></div>
    </div>
  </div>
  <div id="shot" data-act="shotclose" hidden><img id="shotImg" alt="Screenshot"><p>Press and hold the picture to save it</p></div>
  <div id="toast" class="glass" role="status" hidden></div>
</div>

   case 'clearbg':closePop();clearBg();toast('Background song removed');break;
   case 'vsound':closePop();V.muted=!V.muted;toast(V.muted?'Video sound off':'Video sound on');break;
   case 'speed':V.playbackRate=parseFloat(v)||1;renderSheet();break;
   case 'sheet':closePop();openSheet(v);break;
   case 'sheetclose':closeSheet();break;
   case 'sheetback':sheetBack();break;
   case 'sortset':if(S.tab==='video'){sortV=v;LS.set('sortV',v)}else{sortM=v;LS.set('sortM',v)}renderSheet();renderList();break;
   case 'eqon':EQ.on=!EQ.on;saveEq();eqApply();renderSheet();break;
   case 'eqpreset':{var pr=PRESETS.filter(function(p){return p[0]===v})[0];if(pr){EQ.gains=pr[1].slice();EQ.preset=v;EQ.on=true;saveEq();eqApply();renderSheet()}break}
   case 'skinset':skinK=v;LS.set('skin',v);updateArtTheme();renderSheet();break;
   case 'arttheme':artTheme=!artTheme;LS.set('artTheme',artTheme);updateArtTheme();renderSheet();break;
   case 'collapseset':settings.collapse=parseInt(v,10)||0;LS.set('set',settings);armMini();renderSheet();break;
   case 'resumeset':settings.resume=!settings.resume;LS.set('set',settings);renderSheet();break;
   case 'clearrecent':recent=[];LS.set('recent',[]);renderList();toast('Recent cleared');break;
   case 'clearlib':if(!clearArm){clearArm=true;renderSheet();setTimeout(function(){if(clearArm){clearArm=false;if(sheetKind==='settings')renderSheet()}},4000)}else{clearArm=false;clearLibrary()}break;
   case 'shotclose':$('#shot').hidden=true;break;
   case 'scrim':break;
  }
});
$('#fAudio').onchange=function(e){importFiles(e.target.files);e.target.value=''};
$('#fVideo').onchange=function(e){importFiles(e.target.files);e.target.value=''};
$('#fDir').onchange=function(e){importFiles(e.target.files);e.target.value=''};

/* static icons */
document.querySelector('[data-act="npclose"]').innerHTML=I.x;document.querySelector('[data-act="npmenu"]').innerHTML=I.dots;
document.querySelector('[data-act="npPrev"]').innerHTML=I.skipB;document.querySelector('[data-act="npNext"]').innerHTML=I.skipF;
document.querySelector('[data-act="npRew"]').innerHTML=I.rew10;document.querySelector('[data-act="npFwd"]').innerHTML=I.fwd10;
$('#npPlay').innerHTML=I.play;$('#vBack').innerHTML=I.back;$('#vShot').innerHTML=I.shot;$('#vMore').innerHTML=I.dotsH;$('#vPlay').innerHTML=I.play;
$('#mPrevB').innerHTML=I.rw;$('#mNextB').innerHTML=I.ff;$('#mPlay').innerHTML=I.play;

/* start */
applySkin(skinK);renderAll();
openDB().then(dbAll).then(function(all){all.forEach(function(x){items.push(x);byId.set(x.id,x)});restoreLast();renderList();renderCur();updateArtTheme()});
})();
</script>
